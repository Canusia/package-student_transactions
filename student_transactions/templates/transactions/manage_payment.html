{% extends "cis/logged-base-modal.html" %}
{% load templatehelpers %}
{% load crispy_forms_tags %}

{% block body %}
{% include "transactions/includes/transaction_js.html" %}

<script>
$(document).ready(function() {
    function updateCheckFields(obj) {
        if ($(obj).val() === 'check' || $(obj).val() === 'school_pay') {
            $("#id_check_number, #id_check_date").prop('disabled', false);
        } else {
            $("#id_check_number, #id_check_date").prop('disabled', 'disabled');
            $("#id_check_number, #id_check_date").prop('required', 'required');
        }
    }

    updateCheckFields($("#id_label"));

    $(document).on("change", "#id_label", function() {
        updateCheckFields($(this));
    });

    TransactionForm.initFormSubmit('form', "{% url 'student_transactions:manage_payment' student_id %}");

    {% if record %}
    TransactionForm.initDeleteButton("{% url 'student_transactions:delete' record.student.id record.id %}");
    {% endif %}
});
</script>

<form action="" method="post">
    {% csrf_token %}
    {{ form | crispy }}
    <input type="submit" class="btn btn-primary btn-sm" value="Save">
    {% if record %}
    <input type="button" value="Delete Payment" class="btn btn-danger btn-sm delete float-right">
    {% endif %}
</form>
{% endblock %}
